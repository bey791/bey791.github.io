name: IndexNow

# Key setup
# The IndexNow key is a public file at the site root: <key>.txt
# The file body is the key itself. After GitHub Pages deploys,
# https://www.beleaded.com/<key>.txt must return that key.
# indexnow-key.txt hosts the same key for the conventional path.
# This workflow finds the key by matching the filename to the body.
# No GitHub secret is required. To rotate the key, replace the file
# and push to main. Do not add a Bing msvalidate meta tag unless you
# have a verification code from Bing Webmaster Tools.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Submit changed URLs to IndexNow
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/indexnow.py
